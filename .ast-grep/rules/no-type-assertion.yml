id: no-type-assertion
language: TypeScript
# Wave 0 installs this rule at warning because the repo has pre-existing hits
# (2 non-null assertions in src/domain/piston.ts, 4 `as` casts in
# src/application/world-runtime.ts); W3-mx-redstone removes them and raises
# this to error.
severity: warning
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "src/**/*.mts"
  - "src/**/*.cts"
  - "test/**/*.ts"
  - "test/**/*.tsx"
  - "test/**/*.mts"
  - "test/**/*.cts"
  - "vitest.config.ts"
message: >-
  Narrow unknown values with a type guard or construct a validated value;
  do not bypass the type system with a type assertion.
note: >-
  `as const` is the only permitted assertion because it preserves literal
  information without claiming that an unchecked runtime value has another
  type. Runtime boundaries must use a guard or a validated constructor.
rule:
  any:
    - kind: type_assertion
    - kind: non_null_expression
    - all:
        - kind: as_expression
        - not:
            pattern: $VALUE as const
