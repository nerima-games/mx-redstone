name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # changeset status --since needs the full history to diff against
          # origin/main; the default shallow clone only has this commit.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # RELEASE_STANDARD.md §1.2: a PR carrying a user-facing change (public
      # API, behaviour, dependencies) must add a changeset. This is advisory —
      # a docs-only or CI-only PR has nothing to add and is expected to fail
      # this check; that is not this job's call to make, so it does not block
      # the other gates (see `continue-on-error`).
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main
        continue-on-error: true

      # The 99% gate (docs/testing.md §4 row 7), and it is this step that
      # enforces it. No extra flag is needed and none should be added: the
      # thresholds live in vitest.config.ts, and `vitest run --coverage` exits
      # non-zero by itself when any of the four falls below. Keeping the numbers
      # in the config rather than here means `pnpm test:coverage` gates
      # identically on a laptop and in CI, so the gate cannot be one that only
      # ever fires after a push.
      #
      # NOTE: `pnpm verify` deliberately does NOT include this step — it runs
      # `pnpm test` without coverage. Run `pnpm test:coverage` before pushing if
      # you have touched a branch in domain/ or stages/.
      - name: Coverage (99% gate)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
